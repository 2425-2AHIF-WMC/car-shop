<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RevTech Garage - Contact</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link rel="stylesheet" href="contactstyle.css">
  <script defer src="index.js"></script>
</head>
<body>

<header class="bg-black p-6 sticky top-0 z-50 flex justify-between items-center">
  <h1 class="text-3xl font-bold text-red-500 cursor-pointer" onclick="location.href='index.html'">RevTech Garage</h1>
  <nav>
    <ul class="flex space-x-6 text-white">
      <li><a href="index.html" class="hover:text-red-500">Home</a></li>
      <li><a href="index.html#cars" class="hover:text-red-500">Cars</a></li>
      <li><a href="services.html" class="hover:text-red-500">Services</a></li>
      <li><a href="#" class="text-red-500">Contact</a></li>
    </ul>
  </nav>
</header>

<main class="max-w-3xl mx-auto px-6 py-16">
  <h2 class="text-5xl font-bold mb-10 text-center fade-in">📅 Book an Appointment</h2>
  <form id="appointmentForm" class="space-y-6 bg-black p-8 rounded-lg shadow-lg fade-in">
    <div>
      <label class="block mb-2 font-bold" for="name">Name</label>
      <input type="text" id="name" name="name" class="w-full px-4 py-2 rounded bg-gray-800 text-white" required>
    </div>
    <div>
      <label class="block mb-2 font-bold" for="email">Email</label>
      <input type="email" id="email" name="email" class="w-full px-4 py-2 rounded bg-gray-800 text-white" required>
    </div>
    <div>
      <label class="block mb-2 font-bold" for="date">Preferred Date</label>
      <input type="date" id="date" name="date" class="w-full px-4 py-2 rounded bg-gray-800 text-white" required>
    </div>
    <div>
      <label class="block mb-2 font-bold" for="service">Service</label>
      <select id="service" name="service" class="w-full px-4 py-2 rounded bg-gray-800 text-white" required>
        <option value="">Select a service</option>
        <option value="Oil Change">Oil Change</option>
        <option value="Tire Services">Tire Services</option>
        <option value="Brake Inspection">Brake Inspection</option>
        <option value="Engine Diagnostics">Engine Diagnostics</option>
        <option value="Performance Mods">Performance Mods</option>
        <option value="Detailing">Detailing</option>
      </select>
    </div>
    <div>
      <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded font-bold transition">
        Book Appointment
      </button>
    </div>
    <p id="formMessage" class="text-center mt-4 text-green-500 font-bold hidden">✅ Appointment booked!</p>
  </form>
</main>

<footer class="bg-black text-center p-6 mt-20 text-sm text-white">
  <p>© 2025 RevTech Garage. Built by Aldin, Sulejman & David 🚗🔥</p>
</footer>

</body>
</html>
